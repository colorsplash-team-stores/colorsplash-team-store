function lum(h){const n=parseInt(String(h).slice(1),16)||0;const c=[n>>16,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function paintSplat(){const c=$("#splat");if(!c)return;const b=c.getBoundingClientRect();if(!b.width)return;const d=devicePixelRatio||1;c.width=b.width*d;c.height=b.height*d;const x=c.getContext("2d");x.scale(d,d);
  let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const cols=["#f37021","#f6c90f","#8dc63f","#36a9e1","#e6007e","#e30613"];const n=Math.max(4,Math.ceil(b.width/120));x.globalAlpha=.17;

function bindShop(){
  const app=$("#app");
  app.onclick=e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.side){const [pid,sd]=b.dataset.side.split("|");captureSel(pid);S.side[pid]=sd;refreshArt(pid);return}
    if(b.dataset.open){S.storeId=b.dataset.open;S.cart=[];history.pushState(null,"","/s/"+storeById(S.storeId).slug);render();scrollTo(0,0)}
    else if("back" in b.dataset){S.storeId=null;S.cart=[];history.pushState(null,"","/");render()}
    else if(b.dataset.size){const [pid,z]=b.dataset.size.split("|");captureSel(pid);S.sel[pid]={...(S.sel[pid]||{}),size:z};render()}
    else if(b.dataset.add){addToCart(b.dataset.add)}
    else if("closeco" in b.dataset){captureForm();S.checkout=false;render()}
    else if(b.dataset.rm){captureForm();S.cart.splice(+b.dataset.rm,1);render()}
    else if(b.dataset.ful){captureForm();S.ful=b.dataset.ful;render()}
    else if("donedone" in b.dataset){S.done=null;render()}
  };
  app.oninput=e=>{const t=e.target,m=/^(pn|pu)-(.+)$/.exec(t.id||"");if(!m)return;
    if(m[1]==="pu"){const c=t.value.replace(/\D/g,"").slice(0,2);if(c!==t.value)t.value=c}
    captureSel(m[2]);S.side[m[2]]="back";refreshArt(m[2])};
  const f=$("#coForm");if(f)f.onsubmit=e=>{e.preventDefault();placeOrder()};
}
function captureSel(pid){const s=S.sel[pid]||{};const n=$("#pn-"+pid),u=$("#pu-"+pid),q=$("#q-"+pid);if(n)s.pname=n.value;if(u)s.pnum=u.value;if(q)s.qty=q.value;S.sel[pid]=s}
function captureForm(){const g=id=>$("#"+id)?.value;if(!$("#coForm"))return;S.form={name:g("f-name"),email:g("f-email"),phone:g("f-phone"),player:g("f-player"),addr:g("f-addr")??S.form?.addr}}
function addToCart(pid){
  captureSel(pid);const sel=S.sel[pid];const s=storeById(S.storeId);const p=s.products.find(x=>x.id===pid);
  if(!sel.size){toast("Pick a size first");return}
  const qty=Math.max(1,Math.min(20,parseInt(sel.qty)||1));
  const pnum=(sel.pnum||"").replace(/\D/g,"").slice(0,2), pname=(sel.pname||"").trim().toUpperCase().slice(0,14);
  S.cart.push({pid,size:sel.size,qty,pname:p.personalize?pname:"",pnum:p.personalize?pnum:""});
  S.sel[pid]={};render();toast("Added "+p.name+" · "+sel.size);
}
async function placeOrder(){
  captureForm();const s=storeById(S.storeId),f=S.form,err=$("#coErr");
  const bad=!f.name?.trim()?"Add the parent or guardian name.":!/^\S+@\S+\.\S+$/.test(f.email||"")?"Add a valid email so we can confirm your order.":!f.player?.trim()?"Add the player's name.":S.ful==="ship"&&!f.addr?.trim()?"Add a shipping address.":null;
  if(bad){err.textContent=bad;err.hidden=false;return}
  if(status(s)!=="open"){err.textContent="This store isn't taking orders right now.";err.hidden=false;return}
  const payload={store_id:s.id,parent:f.name.trim(),email:f.email.trim(),phone:(f.phone||"").trim(),player:f.player.trim(),fulfillment:S.ful,address:S.ful==="ship"?f.addr.trim():"",items:S.cart.map(l=>({product_id:l.pid,size:l.size,qty:l.qty,pname:l.pname,pnum:l.pnum}))};
  const btn=$("#coForm button[type=submit]");btn.disabled=true;btn.textContent="Placing order…";
  const {data,error}=await sb.rpc("place_order",{p:payload});
  if(error){btn.disabled=false;btn.textContent="Place order";err.hidden=false;const msg=error.message||"";const k=Object.keys(ORDER_ERR).find(x=>msg.includes(x));err.textContent=k?ORDER_ERR[k]:"The order didn't go through. Check your connection and try again.";return}
  S.done={order:{code:data.code,total:Number(data.total),parent:payload.parent,player:payload.player},store:s};S.cart=[];S.checkout=false;render();scrollTo(0,0);loadOrders();
}

function readEditor(){
  const s=S.editing,g=id=>$("#"+id),v=id=>g(id)?.value??"",n=id=>Number(v(id))||0,c=id=>!!g(id)?.checked;
  Object.assign(s,{name:v("e-name").trim(),season:v("e-season").trim(),color:v("e-color"),color2:v("e-color2"),opens:v("e-opens"),closes:v("e-closes"),fundraiserPct:n("e-fund"),payMode:v("e-pay"),payLink:v("e-paylink").trim(),pickup:c("e-pickup"),ship:c("e-ship"),pickupNote:v("e-pnote"),shipFee:n("e-sfee")});
  s.products=s.products.map((p,i)=>({...p,supplier:v("pr-sup-"+i)||p.supplier||"sanmar",supplierName:g("pr-supn-"+i)?v("pr-supn-"+i).trim():(p.supplierName||""),sanmarStyle:v("pr-sty-"+i).trim().toUpperCase(),sanmarColor:v("pr-scol-"+i).trim(),cost:n("pr-cost-"+i),gColor:v("pr-gc-"+i)||p.gColor||"team",art:v("pr-art-"+i)||p.art,name:v("pr-name-"+i).trim(),kind:v("pr-kind-"+i),price:n("pr-price-"+i),desc:v("pr-desc-"+i).trim(),youth:c("pr-y-"+i),adult:c("pr-a-"+i),personalize:c("pr-p-"+i),nameFee:n("pr-nf-"+i),numberFee:n("pr-uf-"+i)}));
}
async function saveStore(){
  readEditor();const s=S.editing,err=$("#edErr");
  const bad=!s.name?"Give the store a team name.":!s.opens||!s.closes||s.closes<s.opens?"Set an open date before the close date.":!s.pickup&&!s.ship?"Turn on pickup, shipping, or both.":s.products.some(p=>!p.name||!(p.youth||p.adult))?"Each item needs a name and at least one size run.":s.payLink&&!/^https:\/\//.test(s.payLink)?"The payment link should start with https://":null;
  if(bad){err.textContent=bad;err.hidden=false;return}
  const btn=$("#edForm button[type=submit]");if(btn){btn.disabled=true;btn.textContent="Saving…"}
  try{
    if(!s.slug)s.slug=slugify(s.name);
    let r=await sb.from("stores").upsert(storeRow(s));
    if(r.error&&r.error.code==="23505"){s.slug=slugify(s.name)+"-"+Math.random().toString(36).slice(2,5);r=await sb.from("stores").upsert(storeRow(s))}
    if(r.error)throw r.error;
    const prows=s.products.map((p,i)=>prodRow(s,p,i));
    if(prows.length){const pr=await sb.from("products").upsert(prows);if(pr.error)throw pr.error}
    let dq=sb.from("products").delete().eq("store_id",s.id);
    if(prows.length)dq=dq.not("id","in",`(${s.products.map(p=>'"'+p.id+'"').join(",")})`);
    const dr=await dq;if(dr.error)throw dr.error;
    if(prows.length){const sr=await sb.from("product_supply").upsert(s.products.map(p=>({product_id:p.id,supplier:p.supplier||"sanmar",supplier_name:p.supplierName||"",style:p.sanmarStyle||"",color:p.sanmarColor||"",cost:Number(p.cost)>0?Number(p.cost):null})));if(sr.error)throw sr.error}
    S.editing=null;S.adminStore=s.id;await loadStores();toast("Store saved");render();
  }catch(e){if(btn){btn.disabled=false;btn.textContent="Save store"}err.textContent="Couldn't save the store: "+(e.message||"check your connection and try again.");err.hidden=false}
}
function csv(s){
  const os=allOrders().filter(o=>o.storeId===s.id);const q=x=>`"${String(x??"").replace(/"/g,'""')}"`;
  const rows=[["Order","Created","Player","Parent","Email","Phone","Item","Supplier","Style #","Color","Size","Qty","Back name","Number","Unit price","Delivery","Address","Order total","Paid","Status"]];
  for(const o of os)for(const i of o.items)rows.push([o.code,o.createdAt,o.player,o.parent,o.email,o.phone,i.name,supName((s.products||[]).find(x=>x.id===i.pid)),(s.products||[]).find(x=>x.id===i.pid)?.sanmarStyle||"",(s.products||[]).find(x=>x.id===i.pid)?.sanmarColor||"",i.size,i.qty,i.pname,i.pnum,i.unit,o.fulfillment,o.address,o.total,o.paid?"yes":"no",o.status]);
  return rows.map(r=>r.map(q).join(",")).join("\n");
}
function bindAdmin(){
  const app=$("#app");
  app.onclick=async e=>{
    const b=e.target.closest("button");if(!b)return;const d=b.dataset;
    if("new" in d){S.editing=blankStore();S.editing.products=[blankProduct()];render()}
    else if(d.adm){S.adminStore=d.adm;render();scrollTo(0,0)}
    else if("admback" in d){S.adminStore=null;render()}
    else if(d.edit){S.editing=JSON.parse(JSON.stringify(storeById(d.edit)));render()}
    else if("cancel" in d){S.editing=null;render()}
    else if("addprod" in d){readEditor();S.editing.products.push(blankProduct());render()}
    else if(d.rmphoto){readEditor();delete S.editing.products[+d.rmphoto].photo;render()}
    else if(d.dup){const src=storeById(d.dup);const c=JSON.parse(JSON.stringify(src));c.id=rid("s-");delete c.slug;c.name=src.name+" (copy)";delete c.example;delete c.archived;c.products=(c.products||[]).map(p=>({...p,id:rid("p-")}));const t=new Date(),e2=new Date(Date.now()+14*864e5);c.opens=t.toISOString().slice(0,10);c.closes=e2.toISOString().slice(0,10);S.editing=c;render();scrollTo(0,0);toast("Copied. Change the name, logos and colors, then save.")}
    else if(d.rmprod){readEditor();S.editing.products.splice(+d.rmprod,1);render()}
    else if("archive" in d){readEditor();S.editing.archived=!S.editing.archived;await saveStore()}
    else if(d.copy){try{await navigator.clipboard.writeText(d.copy);toast("Link copied")}catch{const r=document.createRange();r.selectNodeContents(b.previousElementSibling);getSelection().removeAllRanges();getSelection().addRange(r);toast("Link selected. Copy it from here.")}}
    else if(d.paid){const o=allOrders().find(x=>x.id===d.paid);const {error}=await sb.from("orders").update({paid:!o.paid}).eq("id",o.id);if(error)toast("Couldn't update payment");else{o.paid=!o.paid;render()}}
    else if("refresh" in d){toast("Refreshing…");await loadStores();await loadOrders();toast("Up to date")}
    else if("signout" in d){await sb.auth.signOut()}
    else if("csv" in d){const s=storeById(S.adminStore);const name=s.name.replace(/[^\w]+/g,"-").toLowerCase()+"-orders.csv";
      const url=URL.createObjectURL(new Blob([csv(s)],{type:"text/csv"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
  };
  app.onchange=async e=>{const t=e.target;
    if(t.id==="brand-up"&&t.files?.[0]){toast("Uploading…");try{const u=await upload(t.files[0],"brand","brand/logo");const im=$("#brandLogo");im.hidden=false;$("#brandText").hidden=true;im.src=u+"?v="+Date.now();toast("Shop logo updated")}catch(x){toast("Couldn't upload the logo: "+(x.message||"try again"))}return}
    if(/^pr-photo-\d+$/.test(t.id)&&t.files?.[0]){readEditor();const i=+t.id.split("-")[2];      toast("Uploading…");try{S.editing.products[i].photo=await upload(t.files[0],S.editing.id);render();toast("Photo added")}catch{toast("Couldn't upload that photo. Try a JPG or PNG under 20 MB.")}return}
    if(S.editing&&/^(pr-(gc|art|kind|p|sup)-\d+|e-color2?)$/.test(t.id)){readEditor();render();return}
    if((t.id==="e-logo"||t.id==="e-word")&&t.files?.[0]){readEditor();      toast("Uploading…");try{S.editing[t.id==="e-logo"?"logo":"wordmark"]=await upload(t.files[0],S.editing.id);render();toast("Logo added")}catch{toast("Couldn't upload that image. Try a PNG under 20 MB.")}return}
    if(t.dataset.stat){const o=allOrders().find(x=>x.id===t.dataset.stat);const {error}=await sb.from("orders").update({status:t.value}).eq("id",t.dataset.stat);if(error)toast("Couldn't update status");else{if(o)o.status=t.value;toast("Marked "+t.value)}}};
  const f=$("#edForm");if(f)f.onsubmit=e=>{e.preventDefault();saveStore()};
}

/* ---------- boot ---------- */
$("#tab-shop").onclick=()=>{const st=storeById(S.storeId);history.pushState(null,"",st?"/s/"+st.slug:"/");S.view="shop";render()};
$("#tab-admin").onclick=()=>{history.pushState(null,"","/admin");S.view="admin";S.done=null;S.checkout=false;render()};
$("#checkoutBtn").onclick=()=>{S.checkout=true;render();scrollTo(0,0)};
addEventListener("popstate",()=>{resolveRoute();render()});
resolveRoute();render();paintSplat();
let _rs;addEventListener("resize",()=>{clearTimeout(_rs);_rs=setTimeout(paintSplat,150)});

(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  await checkAdmin(session);await loadStores();loadOrders();
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev!=="SIGNED_IN"&&ev!=="SIGNED_OUT")return;setTimeout(async()=>{const was=S.canEdit,had=!!S.session;await checkAdmin(sess);if(was!==S.canEdit||had!==!!S.session){await loadStores();await loadOrders()}render()},0)});
})();
</script>
